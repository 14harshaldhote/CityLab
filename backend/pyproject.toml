[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citylab"
version = "0.1.0"
description = "A self-running simulated city: people, families, jobs, schools and a social graph, minute by minute"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "numpy>=1.26",
  "networkx>=3.2",
  "pydantic>=2.6",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["citylab*"]

[tool.setuptools.package-data]
citylab = ["storage/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
