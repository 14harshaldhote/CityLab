services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: citylab
      POSTGRES_PASSWORD: citylab
      POSTGRES_DB: citylab
    volumes:
      - citylab-db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citylab"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      CITYLAB_DATABASE_URL: postgresql://citylab:citylab@db:5432/citylab
      CITYLAB_CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  citylab-db:
